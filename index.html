<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>@Ibyar Aurora</title>
	<link rel="icon" type="image/png" href="/favicon.png" />
	<base href="/aurora-demo/" />
	<meta name="description" content="Ibyar Aurora Example" />
	<meta content="width=device-width, initial-scale=1" name="viewport" />
	<link rel="preload" as="style" href="/aurora-demo/web_modules/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
	<link rel="modulepreload" href="/aurora-demo/web_modules/@ibyar/example@5.0.1/dist/index.js" />
	<!-- Start Single Page Apps for GitHub Pages -->
	<script type="text/javascript">
		// Single Page Apps for GitHub Pages
		// MIT License
		// https://github.com/rafgraph/spa-github-pages
		// This script checks to see if a redirect is present in the query string,
		// converts it back into the correct url and adds it to the
		// browser's history using window.history.replaceState(...),
		// which won't cause the browser to attempt to load the new url.
		// When the single page app is loaded further down in this file,
		// the correct url will be waiting in the browser's history for
		// the single page app to route accordingly.
		(function (l) {
			if (l.search[1] === '/') {
				var decoded = l.search.slice(1).split('&').map(function (s) {
					return s.replace(/~and~/g, '&')
				}).join('?');
				window.history.replaceState(null, null,
					l.pathname.slice(0, -1) + decoded + l.hash
				);
			}
		}(window.location))
	</script>
	<!-- End Single Page Apps for GitHub Pages -->
</head>

<body class="container-fluid py-3" data-bs-theme="dark">


	<div id="root"></div>
	<app-root id="app-root" name="root-component" (test)="testFunction" @eventTest="testFunction()"
		ontest="testFunction"></app-root>

	<script type="text/javascript">
		window.testFunction = function (params) {
			console.log('params', params);
		};
		window.onload = function () {
			const time = window.performance.timing.domContentLoadedEventEnd - window.performance.timing.navigationStart;;
			console.log("Time until everything loaded: ", time);
		};
	</script>
	<script type="module" src="/aurora-demo/web_modules/@ibyar/example@5.0.1/dist/index.js"></script>

</body>

</html>
